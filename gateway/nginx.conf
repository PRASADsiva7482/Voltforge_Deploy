# =============================================================================
# VoltForge Gateway — Unified Reverse Proxy Configuration (HTTP + HTTPS)
# =============================================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream ui_upstream {
    server voltforge-ui:80 max_fails=3 fail_timeout=10s;
}

upstream bl_upstream {
    server voltforge-bl:2001 max_fails=3 fail_timeout=10s;
}

upstream ai_upstream {
    server voltforge-ai:2002 max_fails=3 fail_timeout=10s;
}

upstream keycloak_upstream {
    server keycloak:8080 max_fails=3 fail_timeout=10s;
}

# ── HTTP Server (Port 80) — Redirect to HTTPS ────────────────────────────────
server {
    listen 80;
    server_name _;

    # Health check for Azure Load Balancer / NSG / monitors
    location = /healthz {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # ACME challenge for automated Let's Encrypt renewals
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS Server (Port 443) — TLS with Let's Encrypt ──────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/voltforge-lkc7bzuikvaz2.westus2.cloudapp.azure.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/voltforge-lkc7bzuikvaz2.westus2.cloudapp.azure.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 100M;

    # Health check
    location = /healthz {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # ── Keycloak Identity Endpoints ──────────────────────────────────────────
    location ~* ^/(realms|resources|admin|js)/ {
        proxy_pass http://keycloak_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port 443;

        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # ── VoltForge AI Microservice ────────────────────────────────────────────
    location /voltForge-ai/ {
        proxy_pass http://ai_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # AI inference / circuit verification timeout
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── VoltForge Backend API & WebSockets ────────────────────────────────────
    location /voltForge-app/ {
        proxy_pass http://bl_upstream;
        proxy_http_version 1.1;

        # WebSocket support (collaborative canvas, simulation streaming)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── VoltForge Frontend UI (SPA) ──────────────────────────────────────────
    location / {
        proxy_pass http://ui_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
